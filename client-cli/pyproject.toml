[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "srnet-client"
version = "0.2.0"
description = "SRNet client: chat, mail, files and SNApps over Session Router"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "pyzmq>=25",
]

[project.optional-dependencies]
qr = ["qrcode>=7"]

[project.scripts]
srnet = "srnet.cli:main"

[tool.setuptools]
packages = ["srnet"]
